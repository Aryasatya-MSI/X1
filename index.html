<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X1 | SMA Al-Abidin</title>
    
    <!-- ==========================================
         BAGIAN 1: PENGATURAN FONT DARI GOOGLE
         ========================================== -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Manrope:wght@200;300;400&display=swap" rel="stylesheet">

    <!-- ==========================================
         BAGIAN 2: CSS (DESAIN & TATA LETAK)
         ========================================== -->
    <style>
        /* --- A. PENGATURAN DASAR (CORE) --- */
        :root {
            --bg: #020202;         
            --text: #f5f5f5;       
            --accent: #d4af37;     
            --surface: #070707;    
        }

        * { 
            margin: 0; padding: 0; box-sizing: border-box; 
            cursor: none; 
        }

        body {
            background-color: var(--bg); 
            color: var(--text);
            font-family: 'Manrope', sans-serif; 
            overflow-x: hidden; 
            -webkit-font-smoothing: antialiased;
        }

        h1, h2, .serif { 
            font-family: 'Cinzel', serif; 
            font-weight: 400; 
        }

        /* --- B. DESAIN KURSOR KUSTOM --- */
        .cursor-dot, .cursor-outline {
            position: fixed; top: 0; left: 0; transform: translate(-50%, -50%);
            border-radius: 50%; z-index: 19999; pointer-events: none;
        }
        .cursor-dot { 
            width: 5px; height: 5px; background-color: var(--accent); 
        }
        .cursor-outline {
            width: 40px; height: 40px; border: 1px solid rgba(212, 175, 55, 0.5);
            transition: width 0.3s ease, height 0.3s ease, background-color 0.3s ease;
        }
        .button-group{
            display: flex;
            gap: 15px;
        }

        /* --- C. HEADER & JUDUL UTAMA (HERO) --- */
        nav { 
            position: fixed; top: 0; width: 100%; padding: 40px 5vw; 
            display: flex; justify-content: space-between; 
            z-index: 100; mix-blend-mode: difference; 
        }
        .brand { font-family: 'Cinzel', serif; font-size: 1.2rem; letter-spacing: 4px; }
        
        .hero { 
            height: 50vh; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; text-align: center; 
        }
        .hero h1 { font-size: clamp(4rem, 10vw, 8rem); line-height: 1; letter-spacing: 2px; }
        .hero p { 
            margin-top: 20px; font-weight: 200; letter-spacing: 2px; 
            text-transform: uppercase; font-size: 0.9rem; color: #888; 
        }

        /* --- D. SISTEM GRID/KOLOM GALERI --- */
        .gallery-container { padding: 100px 5vw; max-width: 1800px; margin: 0 auto; }
        .section-title { font-size: 3rem; margin-bottom: 80px; text-align: center; color: var(--accent); }

        .grid-lux {
            display: grid; grid-template-columns: repeat(12, 1fr); 
            gap: 50px; margin-bottom: 150px;
            perspective: 2000px; 
            align-items: start; 
        }
        .card button {
            background:#00c8ff;
            color:white;
            border:none;
            border-radius:10px;
            padding:15px 35px;
            box-shadow:0 0 20px #00c8ff;
            transition:.3s;
        }
        .card button:hover{
            box-shadow:0 0 40px #00c8ff;
            transform:translateY(-2px);
        }

        .card {
            height: 5vh; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; text-align: center; 
        }

        .col-4 { grid-column: span 4; } .col-5 { grid-column: span 5; }
        .col-6 { grid-column: span 6; } .col-7 { grid-column: span 7; }
        .col-8 { grid-column: span 8; } .col-12 { grid-column: span 12; }
        
        .mt-stagger { margin-top: 15vh; } .mt-stagger-small { margin-top: 8vh; }

        /* --- E. DESAIN BINGKAI FOTO 3D --- */
        .frame-box {
            background: linear-gradient(145deg, #121212, #050505);
            padding: 2.5rem; 
            border: 1px solid rgba(255, 255, 255, 0.03);
            box-shadow: 0 30px 60px -10px rgba(0,0,0,1), inset 0 1px 0 rgba(255,255,255,0.05);
            transition: transform 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            transform-style: preserve-3d;
            height: auto; 
            will-change: transform;
        }

        .frame-box::before, .frame-box::after {
            content: ''; position: absolute; width: 25px; height: 25px;
            border-color: rgba(212, 175, 55, 0.4); border-style: solid;
            pointer-events: none; z-index: 5;
        }
        .frame-box::before { top: 0; left: 0; border-width: 1px 0 0 1px; }
        .frame-box::after { bottom: 0; right: 0; border-width: 0 1px 1px 0; }

        .img-wrapper {
            position: relative; width: 100%; height: auto; 
            background: transparent;
            transform: translateZ(30px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            border: 1px solid rgba(255,255,255,0.05);
            display: flex;
        }

        .real-media {
            width: 100%; height: auto; display: block; object-fit: contain; 
        }

        .glare {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(212, 175, 55, 0.0), transparent);
            opacity: 0; transition: opacity 0.3s;
            pointer-events: none; z-index: 10;
            transform: translateZ(35px);
        }
        
        .hover-target { z-index: 10; }

        /* ==========================================
           --- F. DESAIN ANIMASI AMPLOP (POPUP BARU) ---
           ========================================== */
        /* 1. Wrapper Utama (Posisi di tengah layar) */
        .popup-wrapper {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, 150%); /* Start terselubung di bawah layar */
            opacity: 0;
            visibility: hidden;
            z-index: 10000;
            pointer-events: none;
            
            transition: transform 0.6s 1.0s cubic-bezier(0.36, 0, 0.66, -0.56),
                        opacity 0.6s 1.0s ease,
                        visibility 0.6s 1.0s;
        }

        .popup-wrapper.show {
            transform: translate(-50%, -20%); /* Posisi berhenti pas di tengah layar */
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
            
            transition: transform 0.6s 0s cubic-bezier(0.22, 1, 0.36, 1),
                        opacity 0.6s 0s ease,
                        visibility 0s 0s;
        }

        /* 2. Badan Amplop Utama */
        .envelope {
            position: relative;
            width: 450px;
            height: 300px;
            background: #080808; /* Bagian gelap dalam amplop */
            border-radius: 8px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.9);
            perspective: 1200px; /* Memberi efek 3D saat flap terbuka */
        }

        /* 3. Lipatan-lipatan (Folds) menggunakan Clip Path */
        .fold-left {
            position: absolute; bottom: 0; left: 0;
            width: 50%; height: 100%;
            clip-path: polygon(0 0, 100% 50%, 0 100%);
            background: linear-gradient(to right, #111, #0a0a0a);
            z-index: 3;
        }

        .fold-right {
            position: absolute; bottom: 0; right: 0;
            width: 50%; height: 100%;
            clip-path: polygon(100% 0, 0 50%, 100% 100%);
            background: linear-gradient(to left, #141414, #0d0d0d);
            z-index: 3;
        }

        .fold-bottom {
            position: absolute; bottom: 0; left: 0;
            width: 100%; height: 100%;
            clip-path: polygon(0 100%, 50% 45%, 100% 100%);
            background: linear-gradient(to top, #181818, #111);
            z-index: 4; /* Berada di atas lipatan samping */
        }

        /* 4. Tutup Amplop Atas (Flap) */
        .flap {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            clip-path: polygon(0 0, 100% 0, 50% 55%);
            background: linear-gradient(to bottom, #1f1f1f, #151515);
            transform-origin: top;
            z-index: 5; /* Berada paling atas saat tertutup */
            
            /* Animasi Menutup: Tunggu 0.5s (agar surat turun dulu), lalu tutup (0.5s) */
            transition: transform 0.5s 0.5s cubic-bezier(0.4, 0, 0.2, 1),
                        z-index 0s 0.5s; /* Kembalikan z-index saat mau nutup */
        }

        /* 5. Isi Surat (Konten) */
        /* 5. Isi Surat (Konten) */
        .letter {
            position: absolute;
            bottom: 10px; left: 50%;
            transform: translateX(-50%) translateY(0); 
            width: 90%; 
            height: 270px; /* Tinggi surat di dalam amplop */
            background: linear-gradient(145deg, #151515, #080808);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 8px;
            padding: 2.5rem;
            z-index: 2; 
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            justify-content: center;
            
            transition: transform 0.5s 0s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .popup-wrapper.show .letter {
            /* Diubah dari -190px menjadi -130px agar naiknya pas tidak terlalu ke atas */
            transform: translateX(-50%) translateY(-130px); 
            
            transition: transform 0.6s 1.1s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        /* --- LOGIKA ANIMASI SAAT ".show" AKTIF --- */
        
        .popup-wrapper.show .flap {
            transform: rotateX(180deg); /* Buka tutup amplop 180 derajat ke belakang */
            z-index: 1; /* Lempar tutup ke belakang agar surat tidak bertabrakan saat keluar */
            
            /* Delay Membuka: Tunggu amplop sampai atas dulu (0.6s) */
            transition: transform 0.5s 0.6s cubic-bezier(0.4, 0, 0.2, 1),
                        z-index 0s 0.85s; /* Pindah z-index tepat di tengah-tengah putaran lipatan */
        }

        .popup-wrapper.show .letter {
            transform: translateX(-50%) translateY(-190px); /* Surat naik muncul ke atas sejauh 190px */
            
            /* Delay Keluar: Amplop naik(0.6s) + Flap buka(0.5s) = Tunggu 1.1s, baru surat naik */
            transition: transform 0.6s 1.1s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        /* --- VERSI MOBILE (HP & TABLET) --- */
        @media (max-width: 900px) {
            .col-4, .col-5, .col-6, .col-7, .col-8 { grid-column: span 12; margin-top: 0; }
            .frame-box { padding: 1rem; }
        }
        
        @media (max-width: 500px) {
            /* Responsif Amplop untuk Layar Kecil */
            .envelope { width: 90vw; height: 60vw; }
            .letter { height: 55vw; padding: 1.5rem; }
            .popup-wrapper.show .letter { transform: translateX(-50%) translateY(-40vw); }
            .letter h2 { font-size: 1.2rem !important; }
        }
    </style>
</head>
<body>

    <!-- ==========================================
         BAGIAN 3: HTML KONTEN (STRUKTUR HALAMAN)
         ========================================== -->

    <div class="cursor-dot" id="cursor-dot"></div>
    <div class="cursor-outline" id="cursor-outline"></div>

    <nav>
        <div class="brand hover-target">AL-ABIDIN</div>
        <div class="brand hover-target">MMXXVI</div>
    </nav>

    <main>
        <section class="hero">
            <h1>KELAS X.1</h1>
            <p>Arsip Dokumentasi & Kenangan Kelas</p>
        </section>

        <section class="card">
            <div class="button-group">
                 <button class="card hover-target" id="btn">Struktur Kelas</button>
                 <a href="https://anggota-x1.vercel.app/">
                    <button class="card hover-target">Lihat Kami</button>
                 </a>
            </div>
        </section>

        <!-- Elemen Amplop / Popup -->
        <div class="popup-wrapper" id="popup">
            <div class="envelope">
                <div class="fold-left"></div>
                <div class="fold-right"></div>
                <div class="fold-bottom"></div>
                
                <div class="letter hover-target">
                    <!-- Bagian Kop Surat -->
                    <h2 class="serif" style="color: var(--accent); margin-bottom: 5px; font-size: 1.6rem; letter-spacing: 1px;">STRUKTUR KELAS</h2>
                    <div style="width: 50px; height: 1px; background: var(--accent); margin: 0 auto 10px auto;"></div>
                    <p style="color: #aaa; font-size: 0.75rem; letter-spacing: 2px;">TAHUN AJARAN 2026/2027</p>
                    
                    <!-- Tabel Anggota -->
                    <div style="margin-top: 20px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 20px; display: grid; gap: 12px; font-size: 0.9rem; color: #ddd; text-align: left; max-width: 85%; margin-inline: auto;">
                        <div style="display: flex; justify-content: space-between;">
                            <span style="color: var(--accent); font-weight: 300;">Wali Kelas</span> 
                            <span style="font-weight: 300;">: Mrs. Adella, S.Pd</span>
                        </div>
                        <div style="display: flex; justify-content: space-between;">
                            <span style="color: var(--accent); font-weight: 300;">Ketua Kelas</span> 
                            <span style="font-weight: 300;">: Rasyid Maulana Essa</span>
                        </div>
                        <div style="display: flex; justify-content: space-between;">
                            <span style="color: var(--accent); font-weight: 300;">Wakil Ketua Kelas</span> 
                            <span style="font-weight: 300;">: Rafi Taufik</span>
                        </div>
                    </div>
                </div>

                <div class="flap"></div>
            </div>
        </div>

        <section class="gallery-container">
            <h2 class="section-title serif">I. Kurasi Foto</h2>
            <div class="grid-lux">
                <div class="frame-box col-7 js-parallax hover-target">
                    <div class="img-wrapper"><img src="Foto3.jpeg" class="real-media" alt="Foto Kenangan"></div>
                    <div class="glare"></div>
                </div>

                <div class="frame-box col-5 mt-stagger js-parallax hover-target">
                    <div class="img-wrapper"><img src="Foto4.jpeg" class="real-media" alt="Foto Kenangan"></div>
                    <div class="glare"></div>
                </div>

                <div class="frame-box col-12 js-parallax hover-target">
                    <div class="img-wrapper"><img src="Foto2.jpeg" class="real-media" alt="Foto Grup"></div>
                    <div class="glare"></div>
                </div>

                <div class="frame-box col-4 js-parallax hover-target">
                    <div class="img-wrapper"><img src="Foto5.jpeg" class="real-media" alt="Momen"></div>
                    <div class="glare"></div>
                </div>
                
                <div class="frame-box col-4 mt-stagger-small js-parallax hover-target">
                    <div class="img-wrapper"><img src="Foto6.jpeg" class="real-media" alt="Momen"></div>
                    <div class="glare"></div>
                </div>
                
                <div class="frame-box col-4 js-parallax hover-target">
                    <div class="img-wrapper"><img src="Foto7.jpeg" class="real-media" alt="Momen"></div>
                    <div class="glare"></div>
                </div>
            </div>

            <h2 class="section-title serif" style="margin-top: 100px;">II. Sinematografi</h2>
            <div class="grid-lux">
                <div class="frame-box col-6 js-parallax hover-target">
                    <div class="img-wrapper">
                        <video class="real-media" autoplay loop muted playsinline controls poster="placeholder1.jpg">
                            <source src="RAPI.mp4" type="video/mp4">
                        </video>
                    </div>
                    <div class="glare"></div>
                </div>

                <div class="frame-box col-6 mt-stagger-small js-parallax hover-target">
                    <div class="img-wrapper">
                        <video class="real-media" autoplay loop muted playsinline controls poster="placeholder2.jpg">
                            <source src="MBUHSOPO.mp4" type="video/mp4">
                        </video>
                    </div>
                    <div class="glare"></div>
                </div>
            </div>
        </section>
    </main>

    <!-- ==========================================
         BAGIAN 4: JAVASCRIPT (LOGIKA & ANIMASI)
         ========================================== -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {

            const btn = document.getElementById("btn");
            const popup = document.getElementById("popup");

            // Tampilkan atau sembunyikan popup saat tombol ditekan
            btn.addEventListener("click", function(){
                popup.classList.toggle("show");
            });

            // Tutup popup saat mengklik di luar area amplop
            document.addEventListener("click", function(event) {
                if (!popup.contains(event.target) && event.target !== btn && popup.classList.contains("show")) {
                    popup.classList.remove("show");
                }
            });
            
            // --- LOGIKA 1: KURSOR KUSTOM ---
            const dot = document.getElementById('cursor-dot');
            const outline = document.getElementById('cursor-outline');
            const hoverTargets = document.querySelectorAll('.hover-target');
            let mouseX = window.innerWidth/2, mouseY = window.innerHeight/2;
            let outlineX = mouseX, outlineY = mouseY;

            window.addEventListener('mousemove', (e) => {
                mouseX = e.clientX; mouseY = e.clientY;
                dot.style.transform = `translate(${mouseX}px, ${mouseY}px)`;
            });

            function animateCursor() {
                outlineX += (mouseX - outlineX) * 0.15; 
                outlineY += (mouseY - outlineY) * 0.15;
                outline.style.transform = `translate(${outlineX}px, ${outlineY}px)`;
                requestAnimationFrame(animateCursor);
            }
            animateCursor();

            hoverTargets.forEach(target => {
                target.addEventListener('mouseenter', () => {
                    outline.style.width = '80px'; outline.style.height = '80px';
                    outline.style.backgroundColor = 'rgba(212, 175, 55, 0.1)';
                });
                target.addEventListener('mouseleave', () => {
                    outline.style.width = '40px'; outline.style.height = '40px';
                    outline.style.backgroundColor = 'transparent';
                });
            });

            // --- LOGIKA 2: ANIMASI SCROLL PARALLAX ---
            const parallaxElements = document.querySelectorAll('.js-parallax');
            window.addEventListener('scroll', () => {
                parallaxElements.forEach(el => {
                    let rect = el.getBoundingClientRect();
                    let speed = 0.1; 
                    
                    if (rect.top < window.innerHeight && rect.bottom > 0) {
                        let yPos = (window.innerHeight - rect.top) * speed;
                        el.style.transform = `translateY(${yPos - 50}px)`; 
                    }
                });
            });

            // --- LOGIKA 3: EFEK MIRING 3D SAAT FOTO DI-HOVER ---
            const frames = document.querySelectorAll('.frame-box');
            frames.forEach(frame => {
                const glare = frame.querySelector('.glare');
                
                frame.addEventListener('mousemove', (e) => {
                    // Mencegah efek tilt pada amplop jika menggunakan class frame-box
                    if (frame.classList.contains("popup-wrapper")) return;

                    const rect = frame.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    
                    const centerX = rect.width / 2;
                    const centerY = rect.height / 2;
                    
                    const rotateX = ((y - centerY) / centerY) * -4; 
                    const rotateY = ((x - centerX) / centerX) * 4;
                    
                    let currentY = frame.style.transform.match(/translateY\((.*?)\)/);
                    let transY = currentY ? currentY[0] : 'translateY(0px)';
                    
                    frame.style.transform = `${transY} perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.02, 1.02, 1.02)`;
                    
                    if(glare) {
                        glare.style.opacity = '1';
                        glare.style.background = `radial-gradient(circle at ${x}px ${y}px, rgba(212,175,55,0.15) 0%, transparent 60%)`;
                    }
                });
                
                frame.addEventListener('mouseleave', () => {
                    if (frame.classList.contains("popup-wrapper")) return;

                    let currentY = frame.style.transform.match(/translateY\((.*?)\)/);
                    let transY = currentY ? currentY[0] : 'translateY(0px)';
                    
                    frame.style.transform = `${transY} perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)`;
                    if(glare) glare.style.opacity = '0';
                });
            });
            
        });
    </script>
</body>
</html>
